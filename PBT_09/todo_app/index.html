<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-app">
        <h1>todos</h1>
        <div class="todo-card">
            <header class="todo-header">
                <input type="text" id="todoInput" placeholder="Việc cần làm tiếp theo là gì?" autofocus>
            </header>
            
            <ul id="todoList" class="todo-list"></ul>
            
            <footer id="todoFooter" class="todo-footer">
                <span id="todoCount" class="todo-count">0 items left</span>
                <div class="todo-filters">
                    <button id="filterAll" class="filter-btn active">All</button>
                    <button id="filterActive" class="filter-btn">Active</button>
                    <button id="filterCompleted" class="filter-btn">Completed</button>
                </div>
                <button id="clearCompleted" class="clear-completed">Clear completed</button>
            </footer>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
