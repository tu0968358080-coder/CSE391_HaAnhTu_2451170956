<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Animations</title>
    <link rel="stylesheet" href="animations.css">
</head>
<body>

    <div class="loading-container">
        <div class="spinner"></div>
        <p>Đang tải sản phẩm...</p>
    </div>

    <div class="container">
        <h1 class="title">Danh sách sản phẩm</h1>
        
        <div class="product-grid">
            <div class="card">
                <div class="image-container">
                    <img src="https://picsum.photos/400/300?random=1" alt="Product">
                </div>
                <div class="card-content">
                    <h3>Sản phẩm cao cấp 01</h3>
                    <p>Giá: 1.200.000đ</p>
                    <button class="btn-buy">Mua ngay</button>
                </div>
            </div>

            <div class="card">
                <div class="image-container">
                    <img src="https://picsum.photos/400/300?random=2" alt="Product">
                </div>
                <div class="card-content">
                    <h3>Sản phẩm cao cấp 02</h3>
                    <p>Giá: 2.500.000đ</p>
                    <button class="btn-buy">Mua ngay</button>
                </div>
            </div>

            <div class="card">
                <div class="image-container">
                    <img src="https://picsum.photos/400/300?random=3" alt="Product">
                </div>
                <div class="card-content">
                    <h3>Sản phẩm cao cấp 03</h3>
                    <p>Giá: 850.000đ</p>
                    <button class="btn-buy">Mua ngay</button>
                </div>
            </div>

            <div class="card">
                <div class="image-container">
                    <img src="https://picsum.photos/400/300?random=4" alt="Product">
                </div>
                <div class="card-content">
                    <h3>Sản phẩm cao cấp 04</h3>
                    <p>Giá: 3.100.000đ</p>
                    <button class="btn-buy">Mua ngay</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
