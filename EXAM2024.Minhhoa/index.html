<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List UI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>

<div class="container task-container">

    <div class="task-card-wrapper">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold m-0" style="color: #0f172a;">Task List</h2>
            <button class="btn btn-add-task">
                <i class="fa-solid fa-plus me-1"></i> Add Task
            </button>
        </div>

        <div class="task-item d-flex align-items-center justify-content-between">
            <div style="flex: 2.5;">
                <div class="label-title">Task</div>
                <p class="task-name">Go to gym</p>
            </div>
            <div style="flex: 1.5;">
                <div class="label-title">Priority</div>
                <span class="priority-high">High</span>
            </div>
            <div style="flex: 1.5;" class="text-md-center">
                <span class="status-badge">To Do</span>
            </div>
            <div style="flex: 1;" class="d-flex justify-content-center">
                <span class="progress-circle"></span>
            </div>
            <div style="flex: 1.5;" class="d-flex justify-content-end align-items-center gap-3">
                <i class="fa-regular fa-pen-to-square action-icon icon-edit"></i>
                <i class="fa-regular fa-trash-can action-icon icon-delete"></i>
            </div>
        </div>

        <div class="task-item d-flex align-items-center justify-content-between">
            <div style="flex: 2.5;">
                <div class="label-title">Task</div>
                <p class="task-name">Read a book</p>
            </div>
            <div style="flex: 1.5;">
                <div class="label-title">Priority</div>
                <span class="priority-low">Low</span>
            </div>
            <div style="flex: 1.5;" class="text-md-center">
                <span class="status-badge">Done</span>
            </div>
            <div style="flex: 1;" class="d-flex justify-content-center">
                <span class="progress-circle done"></span>
            </div>
            <div style="flex: 1.5;" class="d-flex justify-content-end align-items-center gap-3">
                <i class="fa-regular fa-pen-to-square action-icon icon-edit"></i>
                <i class="fa-regular fa-trash-can action-icon icon-delete"></i>
            </div>
        </div>

        <div class="task-item d-flex align-items-center justify-content-between">
            <div style="flex: 2.5;">
                <div class="label-title">Task</div>
                <p class="task-name">Go to market</p>
            </div>
            <div style="flex: 1.5;">
                <div class="label-title">Priority</div>
                <span class="priority-medium">Medium</span>
            </div>
            <div style="flex: 1.5;" class="text-md-center">
                <span class="status-badge">In Progress</span>
            </div>
            <div style="flex: 1;" class="d-flex justify-content-center">
                <span class="progress-circle in-progress"></span>
            </div>
            <div style="flex: 1.5;" class="d-flex justify-content-end align-items-center gap-3">
                <i class="fa-regular fa-pen-to-square action-icon icon-edit"></i>
                <i class="fa-regular fa-trash-can action-icon icon-delete"></i>
            </div>
        </div>
    </div>

    <div class="add-task-form-wrapper">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <span class="form-section-title">Add Task</span>
            <button type="button" class="btn-close-custom"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <form>
            <div class="mb-4">
                <label for="taskInput" class="form-label form-label-custom">Task</label>
                <input type="text" class="form-control input-task" id="taskInput" placeholder="Type your task here...">
            </div>

            <div class="d-flex justify-content-between align-items-end">
                <div>
                    <label class="form-label form-label-custom d-block">Priority</label>
                    <div class="btn-group priority-btn-group" role="group">
                        <input type="radio" class="btn-check" name="priority" id="p-high" autocomplete="off">
                        <label class="btn btn-p-high me-2" for="p-high">High</label>

                        <input type="radio" class="btn-check" name="priority" id="p-medium" autocomplete="off">
                        <label class="btn btn-p-medium me-2" for="p-medium">Medium</label>

                        <input type="radio" class="btn-check" name="priority" id="p-low" autocomplete="off" checked>
                        <label class="btn btn-p-low" for="p-low">Low</label>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-submit-add">Add</button>
            </div>
        </form>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    document.querySelector('form').addEventListener('submit', function(event) {
        event.preventDefault(); 

        const taskInput = document.getElementById('taskInput');
        const taskError = document.getElementById('taskError');
        const taskValue = taskInput.value.trim();

        taskInput.classList.remove('is-invalid');
        taskError.textContent = '';

        if (taskValue === '') {
            taskInput.classList.add('is-invalid');
            taskError.textContent = 'Vui lòng nhập tên công việc!';
            return;
        }

        if (taskValue.length > 100) {
            taskInput.classList.add('is-invalid');
            taskError.textContent = 'Tên công việc không được vượt quá 100 kí tự! (Hiện tại: ' + taskValue.length + ' kí tự)';
            return;
        }

        alert('Dữ liệu hợp lệ! Tiến hành thêm công việc: "' + taskValue + '"');
        taskInput.value = ''; 
    });
    </script>
</body>
</html>
