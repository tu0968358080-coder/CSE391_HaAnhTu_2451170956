<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Layout Lab</title>
    <link rel="stylesheet" href="flexbox_layout.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">LOGO</div>
        
        <ul class="nav-menu">
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">About</a></li>
        </ul>

        <div class="nav-auth">
            <button class="btn-login">Login</button>
            <button class="btn-register">Register</button>
        </div>
    </nav>

    <div class="container">
        <h1 class="title">Sản phẩm nổi bật</h1>
        <div class="product-grid">

            <div class="product-card">
                <div class="product-img">Ảnh Sản Phẩm 1</div>
                <div class="product-info">
                    <h3>Tên Sản Phẩm 1</h3>
                    <p class="price">500.000đ</p>
                </div>
                <button class="btn-buy">Mua</button>
            </div>
            <div class="product-card">
                <div class="product-img">Ảnh Sản Phẩm 2</div>
                <div class="product-info">
                    <h3>Tên Sản Phẩm 2</h3>
                    <p class="price">750.000đ</p>
                </div>
                <button class="btn-buy">Mua</button>
            </div>

            <div class="product-card"><div class="product-img">Ảnh 3</div><div class="product-info"><h3>Sản phẩm 3</h3><p class="price">100k</p></div><button class="btn-buy">Mua</button></div>
            <div class="product-card"><div class="product-img">Ảnh 4</div><div class="product-info"><h3>Sản phẩm 4</h3><p class="price">200k</p></div><button class="btn-buy">Mua</button></div>
            <div class="product-card"><div class="product-img">Ảnh 5</div><div class="product-info"><h3>Sản phẩm 5</h3><p class="price">300k</p></div><button class="btn-buy">Mua</button></div>
            <div class="product-card"><div class="product-img">Ảnh 6</div><div class="product-info"><h3>Sản phẩm 6</h3><p class="price">400k</p></div><button class="btn-buy">Mua</button></div>
            <div class="product-card"><div class="product-img">Ảnh 7</div><div class="product-info"><h3>Sản phẩm 7</h3><p class="price">500k</p></div><button class="btn-buy">Mua</button></div>
            <div class="product-card"><div class="product-img">Ảnh 8</div><div class="product-info"><h3>Sản phẩm 8</h3><p class="price">600k</p></div><button class="btn-buy">Mua</button></div>
        </div>
    </div>
</body>
</html>
