<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Positioning Lab</title>
    <link rel="stylesheet" href="positioning.css">
</head>
<body>
    <header class="header">
        <div class="logo">LOGO</div>
        <nav class="nav">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">About</a>
        </nav>
    </header>

    <div class="container">
    
        <aside class="sidebar">
            <h3>Sidebar</h3>
            <ul>
                <li>Category 1</li>
                <li>Category 2</li>
                <li>Category 3</li>
                <li>Category 4</li>
            </ul>
        </aside>

        <main class="content">
            <h1>Product List</h1>
            <div class="product-grid">
                <div class="card">
                    <span class="badge-hot">HOT</span>
                    <div class="product-image">Product Image</div>
                    <div class="product-info">
                        <h3>Product Name</h3>
                        <p>Description of the awesome product.</p>
                    </div>
                </div>
            
                <div class="placeholder-content">
                    <div style="height: 1500px;"></div>
                    <p>End!</p>
                </div>
            </div>
        </main>
    </div>
    <button class="scroll-top-btn">↑</button>
</body>
</html>
